# Fly.io deployment config
# Deploy with: fly launch --name feedback-api

app = "feedback-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7860"
  NODE_ENV = "production"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
