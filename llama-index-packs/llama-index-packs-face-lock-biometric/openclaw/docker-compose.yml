version: "3.8"

services:
  bot:
    build: .
    container_name: face-lock-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - config-data:/app/config
    depends_on:
      - stripe-webhook

  stripe-webhook:
    build: .
    container_name: face-lock-stripe-webhook
    restart: unless-stopped
    command: ["node", "stripe-webhook.js"]
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    volumes:
      - config-data:/app/config

volumes:
  config-data:
