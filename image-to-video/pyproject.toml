[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-video"
version = "0.1.0"
description = "Batch image-to-video pipeline with pluggable providers (Kling V3, GoEnhance), cost estimation, and Face Lock drift verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "morongosteve" }]
keywords = ["image-to-video", "kling", "goenhance", "video-generation", "pipeline"]
dependencies = [
    "aiohttp>=3.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# Face Lock biometric verification (frame sampling + face mesh).
vision = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "mediapipe>=0.10.9",
]
dev = ["pytest>=7.0"]

[project.scripts]
i2v = "image_to_video.pipeline:main"
face-lock-pipeline = "image_to_video.face_lock_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
